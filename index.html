<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Clash Pro</title>
    <!-- Daisy UI & Tailwind css -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="font-poppins">

    <header></header>

    <main class="min-h-screen bg-[#010313] bg-[url(images/background.png)] bg-no-repeat bg-center">

        <!-- Home Screen -->
        <section id="home-screen" class="home min-h-screen text-white flex flex-col justify-center">

            <div class="flex flex-col items-center gap-6 text-center">
                <h1 class="text-8xl font-anton uppercase">Alphabet Clash</h1>
                <p>Unleash Your Keyboard Kung Fu : Press “Enter” to Play</p>
                <button onclick="play()" class="btn bg-white text-black">Play Now</button>
            </div>

        </section>

        <!-- Playground -->
        <section id="playground" class="play-ground hidden">

            <div class="flex flex-col items-center gap-8 pt-16">
                <!-- Screen -->

                <div
                    class="w-[1024px] h-[320px] border-[20px] rounded-2xl border-[#010313CC] bg-[#ffffffb3] text-center">
                    <div class="flex justify-center">
                        <p class="bg-[#2f2941] px-6 pb-3 rounded-b-xl text-white">Don't watch keyboard while
                            playing...</p>
                    </div>
                    <div class="flex justify-center items-center h-full">
                        <p id="current-alphabet" class="text-black text-9xl uppercase">Y</p>
                    </div>
                </div>

                <!-- Keyboard -->

                <div class="uppercase">
                    <div class="my-1 flex w-full justify-center gap-1">
                        <kbd id="w" class="kbd">w</kbd>
                        <kbd id="e" class="kbd">e</kbd>
                        <kbd id="q" class="kbd">q</kbd>
                        <kbd id="r" class="kbd">r</kbd>
                        <kbd id="t" class="kbd">t</kbd>
                        <kbd id="y" class="kbd">y</kbd>
                        <kbd id="u" class="kbd">u</kbd>
                        <kbd id="i" class="kbd">i</kbd>
                        <kbd id="o" class="kbd">o</kbd>
                        <kbd id="p" class="kbd">p</kbd>
                    </div>
                    <div class="my-1 flex w-full justify-center gap-1">
                        <kbd id="a" class="kbd">a</kbd>
                        <kbd id="s" class="kbd">s</kbd>
                        <kbd id="d" class="kbd">d</kbd>
                        <kbd id="f" class="kbd">f</kbd>
                        <kbd id="g" class="kbd">g</kbd>
                        <kbd id="h" class="kbd">h</kbd>
                        <kbd id="j" class="kbd">j</kbd>
                        <kbd id="k" class="kbd">k</kbd>
                        <kbd id="l" class="kbd">l</kbd>
                    </div>
                    <div class="my-1 flex w-full justify-center gap-1">
                        <kbd id="z" class="kbd">z</kbd>
                        <kbd id="x" class="kbd">x</kbd>
                        <kbd id="c" class="kbd">c</kbd>
                        <kbd id="v" class="kbd">v</kbd>
                        <kbd id="b" class="kbd">b</kbd>
                        <kbd id="n" class="kbd">n</kbd>
                        <kbd id="m" class="kbd">m</kbd>
                        <kbd id="/" class="kbd">/</kbd>
                    </div>
                </div>


                <!-- Life score -->

                <div class="flex justify-between w-3/4">
                    <button class="btn rounded-full bg-[#894189] border-[#894189] text-white px-4 shadow-none">
                        Life
                        <img src="images/heart.svg" alt="">
                        <span id="current-life">5</span>
                    </button>
                    <button class="btn rounded-full bg-[#360490] border-[#360490] text-white px-4 shadow-none">
                        Score
                        <img src="images/monetization.svg" alt="">
                        <span id="current-score">0</span>
                    </button>
                </div>

            </div>

        </section>

        <!-- Score -->
        <section class="score min-h-screen hidden">
            <div class="flex justify-center items-center">
                <div
                    class="text-white text-center space-y-5 bg-gradient-to-r from-[#ffffff8f] to-[#98979700] border border-[#ffffff33] p-6 rounded-lg">
                    <h1 class="text-5xl">
                        <span class="font-extrabold">Score:</span>
                        <span>14</span>
                    </h1>
                    <button class="btn">Play Again</button>
                    <p>Practice will make you a Pro</p>
                </div>
            </div>
        </section>

    </main>

    <script src="js/utility.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
